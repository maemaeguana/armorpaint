name: Windows (Vulkan)

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: latest
        install_runtime: false
        cache: true
        stripdown: true

    - name: Compile
      shell: bash
      run: |
        cd paint
        ../base/make --compile

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-x64
        path: paint/build/**
        if-no-files-found: error
        retention-days: 14
